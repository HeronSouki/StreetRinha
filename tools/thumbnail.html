<!doctype html>
<html><head><meta charset="utf-8"><title>Thumbnail</title></head>
<body style="margin:0;background:#111">
<!-- YouTube-style thumbnail, drawn with the video's own pixel engine (320x180, shown at 4x) -->
<canvas id="t" width="1280" height="720" style="width:1280px;height:720px;image-rendering:pixelated"></canvas>
<script src="../src/core.js"></script><script src="../src/chars.js"></script><script src="../src/art.js"></script><script src="../src/fx.js"></script>
<script>
const SC = mkCanvas(W, H), c = SC.x;
function draw() {
  const t = 0.37;
  // split background: red (Lula) | gold storm (Jair), diagonal
  vgrad(c, 0, 0, W, H, ['#1a0508', '#3a0a10', '#1a0508']);
  poly(c, [[0, 0], [150, 0], [120, H], [0, H]], '#8a1010');
  poly(c, [[170, 0], [W, 0], [W, H], [200, H]], '#9a6a00');
  c.save(); c.globalAlpha = 0.5;
  rays(c, 160, 70, 0.2, { col: '#ffffff', alpha: 0.18, n: 18, speed: 0, width: 0.05 });
  c.restore();
  speedLines(c, 160, 80, t, { n: 70, col: '#ffe8c0', r0: 90 });
  // divine light behind the angel
  for (let r = 70; r > 0; r -= 7) { c.save(); c.globalAlpha = 0.12; disc(c, 160, 58, r, '#fff4c0'); c.restore(); }
  // beam clash in the middle
  beam(c, 70, 118, 158, 112, 0.1, { w: 16, cols: ['#b00000', '#ff3020', '#ffa070', '#ffffff'] });
  beam(c, 250, 110, 162, 112, 0.2, { w: 16, cols: ['#a07000', '#ffd020', '#fff0a0', '#ffffff'] });
  disc(c, 160, 112, 17, '#ffffff');
  for (let i = 0; i < 16; i++) { const a = (i / 16) * TAU; tline(c, 160 + Math.cos(a) * 16, 112 + Math.sin(a) * 16, 160 + Math.cos(a) * (28 + (i % 3) * 10), 112 + Math.sin(a) * (28 + (i % 3) * 10), 1, i % 2 ? '#ffffff' : '#ffe040'); }
  for (let i = 0; i < 14; i++) PROP.bill(c, rr(i, 1, 110, 210), rr(i, 2, 8, 120), { rot: i * 1.3 });
  // Vorcaro, the angel, looming above everyone (2x sprite)
  drawChar(c, 'vorcaro', 160, 150, { pose: 'flyOpen', s: 2, flap: 1, t: 0.5, expr: { eyes: 'gold', mouth: 'smile' }, aura: { col: '#fff4b0', t: 0.3, amp: 3, alpha: 0.8 } });
  // big faces
  const L = portrait('lula', { eyes: 'red', mouth: 'shout' });
  const J = portrait('jairSSJ', { eyes: 'glow', mouth: 'shout' });
  const glow = (img, x, y, s, col, flip) => { for (const [dx, dy] of [[-3, 0], [3, 0], [0, -3], [0, 3], [-2, -2], [2, 2], [2, -2], [-2, 2]]) blit(c, tint(img, col), x + dx, y + dy, { s, flip }); blit(c, img, x, y, { s, flip }); };
  glow(L, -6, 34, 6, '#ff3030', false);
  glow(J, W - 18 * 6 + 2, 22, 6, '#fff060', true);
  // flames around Jair's hair
  flames(c, 272, 50, 0.4, { n: 26, h: 40, w: 70, cols: ['#fffff0', '#fff060', '#ffb020'] });
  // VS on the clash point
  disc(c, 160, 112, 20, '#ffffff');
  text(c, 'VS', 160, 112, { ax: 'c', ay: 'm', s: 3, col: GR.fire, ol: '#000' });
  // title band
  c.save(); c.globalAlpha = 0.85; poly(c, [[0, 140], [W, 132], [W, H], [0, H]], '#000'); c.restore();
  R(c, 0, 139, W, 1, '#ffe040');
  text(c, 'STREET RINHA II', 160, 146, { ax: 'c', s: 3, col: GR.fire, ol: '#000' });
  // tag
  c.save(); c.globalAlpha = 0.9; R(c, 3, 3, 128, 13, '#000'); c.restore();
  text(c, 'HYPER PROPINA EDITION', 67, 5, { ax: 'c', col: GR.gold });
}
draw();
const out = document.getElementById('t').getContext('2d');
out.imageSmoothingEnabled = false;
out.drawImage(SC, 0, 0, 1280, 720);
window.__png = () => document.getElementById('t').toDataURL('image/png');
</script></body></html>
