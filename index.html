<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Street Rinha II</title>
<style>
  :root { --bg: #07060b; --fg: #f4ecd8; --accent: #ffcc33; --muted: #8a8398; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: ui-monospace, Menlo, Consolas, monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; }
  #wrap { position: relative; width: min(100%, calc((100vh - 90px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 0 0 2px #221c30, 0 10px 40px #000; }
  canvas { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0,0,0,.72); cursor: pointer; border: 0; color: var(--fg); font: inherit; width: 100%; }
  #start b { font-size: clamp(18px, 4vw, 34px); color: var(--accent); letter-spacing: 2px; }
  #start span { color: var(--muted); font-size: 13px; }
  #bar { width: min(100%, calc((100vh - 90px) * 16 / 9)); display: flex; gap: 10px; align-items: center; font-size: 13px; }
  button.ctl { background: #1c1728; color: var(--fg); border: 1px solid #3a3050; padding: 6px 10px; font: inherit; cursor: pointer; min-width: 40px; }
  button.ctl:hover { border-color: var(--accent); }
  input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  #time { color: var(--muted); white-space: nowrap; }
  #scene { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 20ch; }
  @media (max-width: 600px) { #scene { display: none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="screen" width="1280" height="720"></canvas>
  <button id="start"><b>▶ APERTE START</b><span>com som · espaço pausa · ←/→ pula 5s · F tela cheia</span></button>
</div>
<div id="bar">
  <button class="ctl" id="play" title="Play/Pause">▶</button>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Posição">
  <span id="time">0:00 / 0:00</span>
  <span id="scene"></span>
  <button class="ctl" id="mute" title="Som">♪</button>
  <button class="ctl" id="fs" title="Tela cheia">⛶</button>
</div>
<script src="src/core.js"></script>
<script src="src/chars.js"></script>
<script src="src/art.js"></script>
<script src="src/fx.js"></script>
<script src="src/engine.js"></script>
<script src="src/story.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
</body>
</html>
